<style>
  :root{
    --bg:#0F1115; --bg2:#14181F; --panel:#171B22; --panel2:#1C212A;
    --krom:#B8BCC4; --krom-acik:#D8DBE0; --beyaz:#F2F3F5;
    --altin:#B9975B; --altin-acik:#D9BC85;
    --cizgi:#262B34; --dim:#7E838D;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--krom);line-height:1.7;font-size:16px;}
  ::selection{background:var(--altin);color:var(--bg);}
  nav{position:sticky;top:0;z-index:50;background:rgba(15,17,21,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--cizgi);}
  .nav-ic{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;}
  .logo{font-weight:800;letter-spacing:.18em;color:var(--beyaz);font-size:1em;text-decoration:none;}
  .logo span{color:var(--altin);}
  .nav-links{display:flex;gap:26px;align-items:center;}
  .nav-links a{color:var(--krom);text-decoration:none;font-size:.86em;font-weight:600;}
  .nav-links a.aktif{color:var(--beyaz);border-bottom:2px solid var(--altin);padding-bottom:3px;}
  .nav-cta{border:1px solid var(--altin);color:var(--altin)!important;border-radius:24px;padding:8px 18px;}
  .nav-links a.nav-yakinda,.nav-links a.nav-yakinda:hover{color:var(--dim);}
  .rozet-yakinda{font-size:.62em;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);border:1px solid var(--cizgi);border-radius:8px;padding:2px 6px;margin-left:7px;vertical-align:middle;}
  @media(max-width:820px){.nav-links a:not(.nav-cta){display:none;}}

  .sec{padding:120px 24px;}
  .dar{max-width:640px;margin:0 auto;text-align:center;}
  .eyebrow{color:var(--altin);font-size:.74em;font-weight:800;letter-spacing:.3em;text-transform:uppercase;margin-bottom:16px;}
  h1{color:var(--beyaz);font-size:clamp(1.9em,4.6vw,3em);font-weight:800;letter-spacing:-.02em;line-height:1.14;margin-bottom:40px;}

  .hero{background:radial-gradient(ellipse 90% 60% at 50% -10%, #1B212B 0%, var(--bg) 60%);padding-top:100px;}

  .kilit-kart{background:var(--panel);border:1.5px dashed var(--cizgi);border-radius:16px;padding:44px 36px;opacity:.75;}
  .kilit-ikon{color:var(--dim);margin-bottom:18px;}
  .kilit-kart p{color:var(--dim);font-size:1.05em;line-height:1.6;max-width:440px;margin:0 auto;}

  footer{border-top:1px solid var(--cizgi);padding:36px 24px;text-align:center;color:var(--dim);font-size:.8em;}
</style>
